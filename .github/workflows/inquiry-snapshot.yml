name: Prepare inquiry update
on:
  push:
    branches: [work/inquiry-ranking-qr]
    paths: [.github/workflows/inquiry-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: inquiry-base
          path: |
            sample-v2/
            tests/two-lesson/
            index.html
          retention-days: 3
