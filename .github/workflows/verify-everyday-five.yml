name: Verify five everyday objects
on:
  push:
    branches: [work/everyday-five-objects]
    paths: [.github/workflows/verify-everyday-five.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact candidate
        env:
          PATCH_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-cabc-8211-8a66-6c2359d2983a/raw?se=2026-09-23T05%3A47%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=d725e8bd-88dd-5a8c-9ad0-3c44af26dc58&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T22%3A58%3A11Z&ske=2026-09-23T22%3A58%3A11Z&sks=b&skv=2026-02-06&sig=irexKUR%2B4L/gkuORnvjV7rQrHCIU8P0OCWF4BvYhUpU%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$PATCH_URL" -o /tmp/patch.zip
          echo '7f2a67ca8c95fac7a762949d474ca323204d08bd4307497d91c13a457660e2a2  /tmp/patch.zip' | sha256sum -c -
          python - <<'PY'
          import pathlib,zipfile,json,hashlib
          with zipfile.ZipFile('/tmp/patch.zip') as z:
              for f in z.infolist():
                  p=pathlib.PurePosixPath(f.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('sample-v2','tests')
              z.extractall('.')
          for f in json.load(open('tests/everyday/patch-manifest.json')):
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Model and original-content tests
        run: |
          node --experimental-default-type=module tests/everyday/model.test.mjs
          node --experimental-default-type=module tests/two-lesson/unit-tests.mjs
      - name: Actual WebGL, student interaction and print checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/everyday-server.log 2>&1 &
          python tests/everyday/browser.py
      - name: Stage validated product files only
        run: |
          set -euo pipefail
          cp /tmp/everyday-qa/student.pdf sample-v2/print/student.pdf
          cp /tmp/everyday-qa/teacher.pdf sample-v2/print/teacher.pdf
          cp /tmp/everyday-qa/report.json tests/everyday/browser-report.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          readme=Path('sample-v2/README.md')
          prior=readme.read_text().split('\n\n## Five familiar objects')[0]
          readme.write_text(prior+'\n\n## Five familiar objects\nReplaces anonymous pouches and the 2+3 split with one ordering of five familiar items: one shoe, one apple, two mandarins as one bundle, one phone and a filled pencil case. Detailed vector illustrations and individual 3D models share one transparent carrier. A smooth object-closeup button allows inspection without changing its load. Similar virtual loads use a dedicated 0–5 N scale with 0.1 N graduations; original 30 N textbook activities are unchanged. No weights or calibration verdict precede measurement. The new storage key preserves older inquiry records. Both 20-page QR editions regenerated. These are designed model weights, not empirically measured consumer products.\n')
          root=Path('sample-v2')
          files=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          Path('tests/two-lesson/file-manifest.json').write_text(json.dumps(files,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2 tests/everyday tests/two-lesson/file-manifest.json
          git commit -m 'feat: add smooth object close-ups to the five-item inquiry'
          git push origin HEAD:work/everyday-five-objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-five-qa
          path: /tmp/everyday-qa/
          retention-days: 3
