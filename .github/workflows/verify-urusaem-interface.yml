name: Verify Urusaem voice and classroom
on:
  push:
    branches: [work/urusaem-voice-expressions]
    paths: [.github/workflows/verify-urusaem-interface.yml]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/urusaem-voice-expressions
          fetch-depth: 0
      - name: Receive exact interface candidate
        env:
          PATCH_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-19dc-81f5-a393-5fd159de920e/raw?se=2026-09-23T11%3A28%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=e5af9746-6600-5651-85ba-e4cb1742a531&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T07%3A54%3A12Z&ske=2026-09-24T07%3A54%3A12Z&sks=b&skv=2026-02-06&sig=aUH6DaJv9EM3TlsfFTCUs9mOfBYHQobpJihq8PW7iUc%3D'
        run: |
          curl -fL --retry 2 "$PATCH_URL" -o /tmp/interface.zip
          echo '60efd18b373d25a52f1cc96ef2c7d6d0252ef5732fe0c6e2ad84565e7442d801  /tmp/interface.zip' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for the real generated voice assembly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/docssam1/msg-science-lab/actions/runs/35852303917'
          for i in range(160):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            data=json.load(urllib.request.urlopen(req,timeout=30))
            print(data['status'],data.get('conclusion'),flush=True)
            if data['status']=='completed':
              assert data['conclusion']=='success','Voice generation did not complete successfully'
              break
            time.sleep(15)
          else:raise RuntimeError('Voice generation still pending; do not publish')
          PY
          git pull --ff-only origin work/urusaem-voice-expressions
          test -s sample-v2/audio/voice-library.json
      - name: Apply exact interface and protect existing content
        run: |
          python - <<'PY'
          import pathlib,zipfile,json,hashlib
          with zipfile.ZipFile('/tmp/interface.zip') as z:
            for f in z.infolist():
              p=pathlib.PurePosixPath(f.filename)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ['sample-v2','tests']
            z.extractall('.')
          for name in ['patch-manifest.json','unchanged.json']:
            for f in json.load(open('tests/voice-coach/'+name)):
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          PY
      - name: Verify voice integrity and original model regressions
        run: |
          node --experimental-default-type=module tests/voice-coach/model.test.mjs
          node --experimental-default-type=module tests/two-lesson/unit-tests.mjs
          node --experimental-default-type=module tests/everyday/model.test.mjs
      - name: Actual Chromium voice, expressions and classroom interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/urusaem-server.log 2>&1 &
          python tests/voice-coach/browser.py
      - name: Commit tested feature files only
        run: |
          cp /tmp/voice-coach-qa/report.json tests/voice-coach/browser-report.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('sample-v2')
          m=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          Path('tests/two-lesson/file-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2 tests/voice-coach tests/two-lesson/file-manifest.json
          git commit -m 'fix: use approved expressions and verified OmniVoice across book and classroom'
          git push origin HEAD:work/urusaem-voice-expressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urusaem-interface-validation
          path: /tmp/voice-coach-qa/
          retention-days: 3
  inspect-reference-classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Continue through reference landing page and inspect actual teach/self
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/reference-classroom');out.mkdir()
          base='https://raw.githack.com/docssam1/lete-on/6b61afc92a24d78cba28b4664bb33db334dd26e4/science-lab/v2/index.html'
          report=[]
          with sync_playwright() as p:
            b=p.chromium.launch(args=['--no-sandbox','--enable-unsafe-swiftshader'])
            context=b.new_context(viewport={'width':1440,'height':900})
            for mode in ['teach','self']:
              page=context.new_page()
              try:
                page.goto(base+'#/s41-u03b/lab-class/'+mode+'/1',wait_until='domcontentloaded',timeout=40000)
                if page.get_by_role('link',name='Open the page',exact=True).count():
                  page.get_by_role('link',name='Open the page',exact=True).click();page.wait_for_timeout(3000)
                  page.goto(base+'#/s41-u03b/lab-class/'+mode+'/1',wait_until='domcontentloaded',timeout=40000)
                page.wait_for_timeout(6000)
                text=page.locator('body').inner_text();page.screenshot(path=str(out/(mode+'.png')),full_page=True)
                (out/(mode+'.txt')).write_text(text)
                report.append({'mode':mode,'url':page.url,'actual_deck':page.locator('.dk-stage').count()>0,'text':text[:1500]})
                if page.locator('[data-a=next]').count():
                  for _ in range(3):page.locator('[data-a=next]').click();page.wait_for_timeout(400)
                  page.screenshot(path=str(out/(mode+'-question.png')),full_page=True)
              except Exception as e:report.append({'mode':mode,'error':str(e)})
              page.close()
            b.close()
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-reference-classroom
          path: /tmp/reference-classroom/
          retention-days: 3
