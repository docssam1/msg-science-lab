name: Import uploaded MSG Science Lab

on:
  push:
    paths:
      - ".github/workflows/import-local-project.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download private uploaded ZIP
        shell: bash
        env:
          PROJECT_ZIP_URL: "https://sdmntpreastus.oaiusercontent.com/files/00000000-0434-81f9-93a6-2df691679694/raw?se=2026-09-22T15%3A02%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=4aeebea9-414f-5c5f-a6aa-ea196383603e&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T23%3A58%3A25Z&ske=2026-09-22T23%3A58%3A25Z&sks=b&skv=2026-02-06&sig=7aNpJRM6VN%2BqIfbw4CwpaC1HtaFRCcUn3hqSZytmUNg%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$PROJECT_ZIP_URL" -o /tmp/msg-science-lab.zip
          test "$(stat -c%s /tmp/msg-science-lab.zip)" -gt 20000000

      - name: Extract exact local Git commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/msg-upload
          mkdir -p /tmp/msg-upload
          unzip -q /tmp/msg-science-lab.zip -d /tmp/msg-upload
          SRC=/tmp/msg-upload/msg-science-lab
          test -d "$SRC/.git"
          test "$(git -C "$SRC" rev-parse HEAD)" = "4438ba8889de8800bd656c029457e63deaeec569"
          git -C "$SRC" archive --format=tar HEAD -o /tmp/msg-science-lab.tar

      - name: Replace repository with uploaded project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -xf /tmp/msg-science-lab.tar -C .
          test -f assets/teacher-ref-recording.mp4
          test -f scripts/omnivoice-clone-teacher.py
          test -f scripts/local/omnivoice-clone-teacher.cmd
          test -f src/ch01.js
          test -f src/variant-selection.js

      - name: Commit and push exact uploaded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import uploaded MSG Science Lab project"
          git push origin HEAD:main
