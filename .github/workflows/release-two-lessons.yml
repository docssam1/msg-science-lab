name: Validate and stage two-lesson sample
on:
  push:
    branches: [work/two-lesson-source-rebuild]
    paths: [.github/workflows/release-two-lessons.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact candidate
        env:
          BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-2c74-81fd-97a2-c4642ab8bf61/raw?se=2026-09-23T02%3A36%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=0659db40-66d5-567f-94c7-a70f279b3e47&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T00%3A17%3A50Z&ske=2026-09-24T00%3A17%3A50Z&sks=b&skv=2026-02-06&sig=%2BbaYHRRRMnp/R6jo5zT/s7kwLTNNj4t0sKVGP2PJ3T8%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$BUNDLE_URL" -o /tmp/candidate.zip
          echo '9cd44fdf221824bf9f0e7d81ae944bcc374451bb5e5fe78bd9c205ad324e03b2  /tmp/candidate.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,pathlib,json,hashlib
          root=pathlib.Path('/tmp/candidate');root.mkdir()
          with zipfile.ZipFile('/tmp/candidate.zip') as z:
              for f in z.infolist():
                  p=pathlib.PurePosixPath(f.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] not in ('sample-v2','qa','index.html'): raise ValueError('Unsafe path')
              z.extractall(root)
          for f in json.load(open(root/'qa/file-manifest.json')):
              p=root/'sample-v2'/f['path']
              assert p.stat().st_size==f['size'] and hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256'],str(p)
          print('All candidate files match the source manifest')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test source content and physics
        run: |
          node --experimental-default-type=module /tmp/candidate/qa/unit-tests.mjs
      - name: Test actual browser and WebGL interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/candidate >/tmp/sample-server.log 2>&1 &
          python /tmp/candidate/qa/final_browser.py
      - name: Stage only the validated sample
        run: |
          set -euo pipefail
          test ! -e sample-v2
          cp -a /tmp/candidate/sample-v2 ./sample-v2
          cp /tmp/candidate/index.html ./index.html
          mkdir -p tests/two-lesson
          cp /tmp/candidate/qa/final_browser.py tests/two-lesson/browser.py
          cp /tmp/candidate/qa/file-manifest.json tests/two-lesson/file-manifest.json
          cp /tmp/qa-final/report.json tests/two-lesson/browser-report.json
          cp /tmp/candidate/qa/unit-tests.mjs tests/two-lesson/unit-tests.mjs
          sed -i "s@'../sample-v2/@'../../sample-v2/@g" tests/two-lesson/unit-tests.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml');s=p.read_text()
          assert '      - name: Upload site' in s and 'path: "."' in s
          s=s.replace('      - name: Upload site', '      - name: Stage public sample only\n        run: |\n          mkdir -p _site\n          cp index.html _site/index.html\n          cp -a sample-v2 _site/sample-v2\n\n      - name: Upload site')
          s=s.replace('path: "."','path: "_site"');p.write_text(s)
          for name in ['collect-sample-assets.yml','sample-narration.yml','test-two-lesson-candidate.yml','release-two-lessons.yml']:
              Path('.github/workflows',name).unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2 index.html tests/two-lesson .github/workflows
          git commit -m 'feat: rebuild two source-based lessons with tested print, video, narration and 3D'
          git push origin HEAD:work/two-lesson-source-rebuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-two-lesson-validation
          path: /tmp/qa-final/
          retention-days: 7
