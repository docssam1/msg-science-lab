name: Stage validated two-lesson sample
on:
  push:
    branches: [work/two-lesson-source-rebuild]
    paths: [.github/workflows/release-two-lessons.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read successful browser test evidence
        uses: actions/download-artifact@v4
        with:
          name: final-two-lesson-validation
          path: /tmp/passed-qa
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: docssam1/msg-science-lab
          run-id: 35811662107
      - name: Download the same verified candidate
        env:
          BUNDLE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-2368-8211-bc46-e62f51c74c5b/raw?se=2026-09-23T02%3A54%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f34c5477-0015-51e9-8301-cc873c51dccc&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A11%3A10Z&ske=2026-09-23T23%3A11%3A10Z&sks=b&skv=2026-02-06&sig=kJphI2rAKfwSiwIMV4%2BTfpLHE2EMwcFQlpsk2Q9X2Y0%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$BUNDLE_URL" -o /tmp/candidate.zip
          echo '6cbac519d378f4c07d09c0b1d448f73850a6fb3c18b3d7f8d75e4be662281bc7  /tmp/candidate.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,pathlib,json,hashlib
          report=json.load(open('/tmp/passed-qa/report.json'))
          assert not report['errors'] and len(report['narration'])==18 and len(report['layouts'])==4
          assert len([x for x in report['checks'] if isinstance(x,dict) and 'media' in x])==3
          root=pathlib.Path('/tmp/candidate');root.mkdir()
          with zipfile.ZipFile('/tmp/candidate.zip') as z:
              for f in z.infolist():
                  p=pathlib.PurePosixPath(f.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] not in ('sample-v2','qa','index.html'): raise ValueError('Unsafe path')
              z.extractall(root)
          for f in json.load(open(root/'qa/file-manifest.json')):
              p=root/'sample-v2'/f['path']
              assert p.stat().st_size==f['size'] and hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256'],str(p)
          print('Exact candidate matches the successful browser and physics tests')
          PY
      - name: Commit product files only
        run: |
          set -euo pipefail
          test ! -e sample-v2
          cp -a /tmp/candidate/sample-v2 ./sample-v2
          cp /tmp/candidate/index.html ./index.html
          mkdir -p tests/two-lesson
          cp /tmp/candidate/qa/final_browser.py tests/two-lesson/browser.py
          cp /tmp/candidate/qa/file-manifest.json tests/two-lesson/file-manifest.json
          cp /tmp/passed-qa/report.json tests/two-lesson/browser-report.json
          cp /tmp/candidate/qa/unit-tests.mjs tests/two-lesson/unit-tests.mjs
          sed -i "s@'../sample-v2/@'../../sample-v2/@g" tests/two-lesson/unit-tests.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2 index.html tests/two-lesson
          git commit -m 'feat: rebuild two source-based lessons with tested print, video, narration and 3D'
          git push origin HEAD:work/two-lesson-source-rebuild
