name: Collect sample assets
on:
  push:
    branches: [work/two-lesson-source-rebuild]
    paths: [.github/workflows/collect-sample-assets.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sample/vendor /tmp/sample/media /tmp/sample/audio /tmp/packs
          cd /tmp/packs
          npm pack page-flip@2.0.7 --ignore-scripts
          mkdir pf; tar -xzf page-flip-2.0.7.tgz -C pf
          cp pf/package/dist/js/page-flip.browser.js /tmp/sample/vendor/
          cp pf/package/LICENSE /tmp/sample/vendor/PAGE-FLIP-LICENSE.txt
          npm pack three@0.184.0 --ignore-scripts
          mkdir three; tar -xzf three-0.184.0.tgz -C three
          cp three/package/build/three.module.js three/package/build/three.core.js /tmp/sample/vendor/
          cp three/package/LICENSE /tmp/sample/vendor/THREE-LICENSE.txt
          cp three/package/examples/jsm/controls/OrbitControls.js /tmp/sample/vendor/
          sed -i "s/from 'three'/from '.\/three.module.js'/" /tmp/sample/vendor/OrbitControls.js
          cd "$GITHUB_WORKSPACE"
          cp assets/audio/*.wav /tmp/sample/audio/
      - name: Download licensed educational video files
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib
          out=pathlib.Path('/tmp/sample/media')
          manifest=[]
          for name in ['HowaWatchWork1949.ogv','Hookeslawexample.ogv']:
              rec={'file':name,'source':'https://commons.wikimedia.org/wiki/File:'+name}
              try:
                  query=urllib.parse.urlencode({'action':'query','format':'json','titles':'File:'+name,'prop':'imageinfo','iiprop':'url|extmetadata'})
                  req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+query,headers={'User-Agent':'MSGScienceLabSample/1.0 (https://github.com/docssam1/msg-science-lab)'})
                  with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
                  info=next(iter(data['query']['pages'].values()))['imageinfo'][0]
                  url=info['url'];rec['metadata']=info.get('extmetadata',{});rec['download_url']=url
                  req=urllib.request.Request(url,headers={'User-Agent':'MSGScienceLabSample/1.0 (https://github.com/docssam1/msg-science-lab)'})
                  with urllib.request.urlopen(req,timeout=120) as r,open(out/name,'wb') as f:
                      while b:=r.read(1024*1024): f.write(b)
                  rec['status']='downloaded';rec['sha256']=hashlib.sha256((out/name).read_bytes()).hexdigest()
              except Exception as e: rec['status']='failed';rec['error']=str(e)
              manifest.append(rec)
          (out/'sources.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Create preview cuts and contact sheets
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/sample/media/HowaWatchWork1949.ogv ]; then
            ffmpeg -y -ss 342 -i /tmp/sample/media/HowaWatchWork1949.ogv -t 39 -an -c:v libx264 -crf 23 -pix_fmt yuv420p -movflags +faststart /tmp/sample/media/watch-mainspring.mp4
            ffmpeg -y -ss 680 -i /tmp/sample/media/HowaWatchWork1949.ogv -t 27 -an -c:v libx264 -crf 23 -pix_fmt yuv420p -movflags +faststart /tmp/sample/media/watch-balance.mp4
            ffmpeg -y -i /tmp/sample/media/watch-mainspring.mp4 -vf 'fps=1/6,scale=320:-1,tile=4x2' -frames:v 1 /tmp/sample/media/watch-contact.jpg
          fi
          if [ -s /tmp/sample/media/Hookeslawexample.ogv ]; then
            ffmpeg -y -i /tmp/sample/media/Hookeslawexample.ogv -vf 'fps=1/20,scale=256:-1,tile=5x5' -frames:v 1 /tmp/sample/media/hooke-contact.jpg
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-lesson-research-assets
          path: /tmp/sample/
          retention-days: 7
