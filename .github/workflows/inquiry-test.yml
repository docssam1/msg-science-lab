name: Validate inquiry and QR
on:
  push:
    branches: [work/inquiry-method-feedback]
    paths: [.github/workflows/inquiry-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact candidate
        env:
          PATCH_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1290-8211-b75b-815b2e3dae37/raw?se=2026-09-23T03%3A29%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=e34a6efa-16c2-5cfb-af23-fb985154f903&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T02%3A53%3A10Z&ske=2026-09-24T02%3A53%3A10Z&sks=b&skv=2026-02-06&sig=sW0awcPbwE1zyhS5V%2BPCUumY9Mg/VNsKoKvZo6IC3kc%3D'
        run: |
          set -euo pipefail
          curl -fL "$PATCH_URL" -o /tmp/patch.zip
          echo '8aa735f7f7bdd1a34dfd988ff1ad6c3d9cd5e394c9c0aa7b345e97ad49c22c18  /tmp/patch.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,pathlib,json,hashlib
          with zipfile.ZipFile('/tmp/patch.zip') as z:
              for f in z.infolist():
                  p=pathlib.PurePosixPath(f.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('sample-v2','tests')
              z.extractall('.')
          for f in json.load(open('tests/inquiry/patch-manifest.json')):
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Source and physics tests
        run: node --experimental-default-type=module tests/two-lesson/unit-tests.mjs
      - name: Interaction and print tests
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/inquiry-server.log 2>&1 &
          python tests/inquiry/browser.py
          python tests/two-lesson/browser.py
      - name: Stage verified changes only
        run: |
          set -euo pipefail
          cp /tmp/inquiry-qa/student.pdf sample-v2/print/student.pdf
          cp /tmp/inquiry-qa/teacher.pdf sample-v2/print/teacher.pdf
          cp /tmp/inquiry-qa/report.json tests/inquiry/browser-report.json
          cp /tmp/qa-final/report.json tests/two-lesson/browser-report.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('sample-v2')
          with open('sample-v2/README.md','a') as f:f.write('\n\n## Inquiry / QR update\nTwo authored introduction pages precede the unchanged 18 textbook-based pages (20 printed pages total). Each page has a tested deep-link QR. Prediction and method validity are assessed independently: no preparatory zero verdict, generic method-error feedback only after a submitted faulty measurement, correction and final explanation. New inquiry narration uses explicitly labelled device speech; existing18OmniVoiceclips are unchanged.\n')
          manifest=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          Path('tests/two-lesson/file-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2 tests
          git commit -m 'feat: add prediction inquiry, delayed method diagnosis and experiment QR workbooks'
          git push origin HEAD:work/inquiry-method-feedback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inquiry-qr-validation
          path: |
            /tmp/inquiry-qa/
            /tmp/qa-final/
          retention-days: 2
