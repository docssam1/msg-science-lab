name: Remove requested cover labels
on:
  push:
    branches: [work/remove-cover-scope-label]
    paths: [.github/workflows/remove-cover-scope.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF editor
        run: python -m pip install PyMuPDF==1.26.7 numpy==2.2.6
      - name: Remove exact cover text and verify unchanged content
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          import fitz,numpy as np
          root=Path('sample-v2');qa=Path('/tmp/cover-qa');qa.mkdir()
          targets=['본책 10–21쪽','원본 본문·과학 이야기·18문항과 추가 도입 탐구']
          expected={'editions.js':'456f0d117d3e1a99eda4c800fd783baed567efcb','print/student.pdf':'b737de4887a21eb22a1d7df97710ffa7ba980650','print/teacher.pdf':'2dc8e7cfc19aa82ffeedbabc867790f375834c5c'}
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def links(page):return [{k:v for k,v in a.items() if k not in ('xref','id')} for a in page.get_links()]
          for name,sha in expected.items():assert blob((root/name).read_bytes())==sha,'Source changed: '+name
          p=root/'editions.js';s=p.read_text()
          old='<p><b>'+targets[0]+'</b><br>'+targets[1]+'</p>'
          assert s.count(old)==1
          p.write_text(s.replace(old,'<div aria-hidden="true"></div>'))
          report=[]
          for kind in ['student','teacher']:
              path=root/f'print/{kind}.pdf';before=fitz.open(path);after=fitz.open(path);rects=[]
              for text in targets:
                  hits=after[0].search_for(text);assert len(hits)==1
                  rect=hits[0]+(-.5,-.5,.5,.5);rects.append(rect)
                  after[0].add_redact_annot(rect,fill=False,cross_out=False)
              after[0].apply_redactions(images=0,graphics=0,text=0)
              temp=path.with_suffix('.new.pdf');after.save(temp,garbage=4,deflate=True,no_new_id=True);after.close();after=fitz.open(temp)
              assert len(after)==len(before)
              assert all(t not in after[0].get_text() for t in targets)
              for i in range(len(before)):
                  assert links(before[i])==links(after[i]),('links changed',kind,i)
                  if i:
                      assert before[i].get_text()==after[i].get_text(),('text changed',kind,i)
                      assert before[i].get_pixmap().samples==after[i].get_pixmap().samples,('image changed',kind,i)
              a=before[0].get_pixmap(matrix=fitz.Matrix(2,2));b=after[0].get_pixmap(matrix=fitz.Matrix(2,2))
              aa=np.frombuffer(a.samples,np.uint8).reshape(a.height,a.width,3);bb=np.frombuffer(b.samples,np.uint8).reshape(b.height,b.width,3)
              changed=np.any(aa!=bb,axis=2);mask=np.zeros(changed.shape,bool)
              for r in rects:mask[max(0,int(r.y0*2)-3):int(r.y1*2)+4,max(0,int(r.x0*2)-3):int(r.x1*2)+4]=True
              assert not np.any(changed&~mask),('unexpected cover change',kind)
              after[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(qa/f'{kind}-after.png')
              report.append({'edition':kind,'pages':len(after),'other_pages_pixel_identical':True,'outside_requested_text_cover_pixels_identical':True,'all_links_preserved':True})
              after.close();before.close();temp.replace(path)
          p=Path('tests/two-lesson/file-manifest.json');manifest=json.loads(p.read_text())
          for f in manifest:
              if f['path'] in expected:
                  file=root/f['path'];f.update(size=file.stat().st_size,sha256=hashlib.sha256(file.read_bytes()).hexdigest())
          p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          (qa/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit only the verified edit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-v2/editions.js sample-v2/print/student.pdf sample-v2/print/teacher.pdf tests/two-lesson/file-manifest.json
          git commit -m 'fix: remove requested textbook scope text from both covers'
          git push origin HEAD:work/remove-cover-scope-label
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cover-text-removal-qa
          path: /tmp/cover-qa/
          retention-days: 3
