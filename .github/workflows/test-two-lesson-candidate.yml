name: Test two-lesson candidate
on:
  push:
    branches: [work/two-lesson-source-rebuild]
    paths: [.github/workflows/test-two-lesson-candidate.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download candidate
        env:
          BUNDLE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-c9ec-8206-ab10-8582bc4b5005/raw?se=2026-09-23T02%3A13%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=89b6ded8-5e0d-575d-875c-076328bc2755&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A20%3A12Z&ske=2026-09-23T23%3A20%3A12Z&sks=b&skv=2026-02-06&sig=ajauZtfRhasYXtmU18ffpAZysfsuPlvex1I1N/bw%2Bg4%3D'
        run: |
          curl -fL "$BUNDLE_URL" -o /tmp/candidate.zip
          echo '8686808f5e6178339d70211c934183386d241b31c90fc323d55d06b5b40dc826  /tmp/candidate.zip' | sha256sum -c -
          mkdir /tmp/candidate
          unzip -q /tmp/candidate.zip -d /tmp/candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/candidate >/tmp/server.log 2>&1 &
          python /tmp/candidate/qa/remote_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-lesson-browser-qa
          path: /tmp/qa-output/
          retention-days: 7
