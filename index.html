<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1f16">
<title>초·과·심 LIVE — 대치 MSG 영재교육</title>
<meta name="description" content="초등과학심화, 이제 살아 움직인다 — 대치 MSG 영재교육 초·과·심 LIVE">
<script>
  // 예전 링크(주소 뒤에 ?page= 나 #…가 붙은 QR·북마크)는 전처럼 앱으로 바로 보낸다
  if (location.search || location.hash) location.replace('./sample-v2/' + location.search + location.hash);
</script>
<link rel="preload" href="./promo/msg-physics/chogwasim-live-showreel-poster.jpg" as="image">
<link rel="stylesheet" href="./sample-v2/fonts/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0c1f16;color:#fff;font-family:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow:hidden}
  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#0c1f16}
  video{width:100vw;height:100vh;height:100dvh;object-fit:contain;background:#0c1f16}
  .top{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;left:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
  .brand{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(12,31,22,.55);backdrop-filter:blur(6px);font-weight:900;font-size:14px;letter-spacing:.02em}
  .brand i{font-style:normal;padding:1px 8px 2px;border-radius:999px;background:#e5483b;font-size:11px}
  .skip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(12,31,22,.55);backdrop-filter:blur(6px);color:#fff;text-decoration:none;font-weight:800;font-size:15px}
  .skip:hover{background:rgba(255,255,255,.14)}
  .sound{position:fixed;left:50%;bottom:max(34px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border:0;border-radius:999px;background:#f0892c;color:#fff;font:inherit;font-weight:900;font-size:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
  .sound[hidden]{display:none}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
  .bar{position:fixed;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#2d6b47,#f5c542)}
  .fade{position:fixed;inset:0;background:#f3f7f3;opacity:0;pointer-events:none;transition:opacity .6s}
  .fade.on{opacity:1}
  @media (prefers-reduced-motion:reduce){.sound{animation:none}.fade{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <video id="reel" playsinline muted autoplay preload="auto" poster="./promo/msg-physics/chogwasim-live-showreel-poster.jpg">
    <source src="./promo/msg-physics/chogwasim-live-showreel.mp4" type="video/mp4">
  </video>
</div>
<div class="top">
  <span class="brand">MSG 초·과·심 <i>LIVE</i></span>
  <a class="skip" id="skip" href="./promo/msg-physics/msg-physics-promo.html">건너뛰기 →</a>
</div>
<button class="sound" id="sound" type="button">🔊 소리 켜고 처음부터 보기</button>
<div class="bar" id="bar"></div>
<div class="fade" id="fade"></div>
<script>
  // 들어오면 1분 쇼릴을 처음부터 재생(브라우저 규칙상 처음엔 소리 없이) → 끝나면 소개 영상 페이지로
  const v = document.getElementById('reel'), sound = document.getElementById('sound'), bar = document.getElementById('bar'), fade = document.getElementById('fade');
  const NEXT = './promo/msg-physics/msg-physics-promo.html';
  let leaving = false;
  const go = () => { if (leaving) return; leaving = true; fade.classList.add('on'); setTimeout(() => location.href = NEXT, 600); };
  v.play().catch(() => { sound.textContent = '▶ 소리 켜고 보기'; });   // 자동 재생이 막히면 누르면 시작
  sound.onclick = () => { v.muted = false; v.currentTime = 0; v.play().catch(() => {}); sound.hidden = true; };
  v.addEventListener('volumechange', () => { if (!v.muted) sound.hidden = true; });
  v.addEventListener('timeupdate', () => { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; });
  v.addEventListener('ended', go);
  v.addEventListener('error', go, true);   // 영상을 못 불러오면 바로 소개 페이지로
  document.getElementById('skip').addEventListener('click', (e) => { e.preventDefault(); go(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') go(); });
</script>
</body>
</html>
